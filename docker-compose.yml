# Local/dev stack: PostgreSQL, Redis, API, Celery worker, web (nginx reverse proxy).
# NOTE: authored on a machine without Docker; NOT yet executed. See docs/product/known-limitations.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talvynza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-talvynza}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talvynza}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    volumes: [uploads:/srv/storage]
    env_file: .env
    environment:
      TALVYNZA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-talvynza}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-talvynza}
      TALVYNZA_REDIS_URL: redis://redis:6379/0
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5
  worker:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    volumes: [uploads:/srv/storage]
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file: .env
    environment:
      TALVYNZA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-talvynza}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-talvynza}
      TALVYNZA_REDIS_URL: redis://redis:6379/0
    depends_on: { api: { condition: service_healthy } }
  web:
    build: { context: ., dockerfile: infrastructure/docker/web.Dockerfile }
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on: [api]
volumes:
  pgdata:
  uploads:
