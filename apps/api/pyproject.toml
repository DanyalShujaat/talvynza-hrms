[project]
name = "talvynza-api"
version = "0.1.0"
description = "TALVYNZA HRMS API (FastAPI modular monolith)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.13", "pydantic>=2.7",
  "pydantic-settings>=2.3", "email-validator>=2.1", "argon2-cffi>=23.1", "cryptography>=42", "pyotp>=2.9",
  "python-multipart>=0.0.9", "openpyxl>=3.1", "celery>=5.4", "redis>=5.0", "psycopg[binary]>=3.2", "tzdata", "packaging",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "pip-audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF100"]
ignore = ["B008", "UP046", "UP017", "C408"]  # B008: FastAPI Depends() idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E501"]
"scripts/*" = ["E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
